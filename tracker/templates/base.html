<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Issue Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    {% if user.is_authenticated %}
    <p>
        Пользователь:
        {{ user.username }}
    </p>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %} 

        <button type="submit" class="btn btn-danger mb-3">
            Выйти
        </button>
    </form>

    {% else %}

    <a href="{% url 'login' %}?next={{ request.GET.next }}" class="btn btn-info mb-3">
        Войти
    </a>

    <a href="{% url 'register' %}?next={{ request.GET.next }}" class="btn btn-dark mb-3">
        Регистрация
    </a>

    {% endif %}

    <a href="{% url 'project_list' %}" class="btn btn-primary mb-3">
        Все проекты
    </a>

    <a href="{% url 'project_add' %}" class="btn btn-success mb-3">
        Создать проект
    </a>

    {% block content %}
    {% endblock %}
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
